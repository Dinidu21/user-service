name: Build and upload JAR to GCS

on:
  push:
    branches: [main]

permissions:
  id-token: write # required for Workload Identity Federation — no static keys
  contents: read

concurrency:
  group: build-user-service
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Get project version from pom.xml
        id: version
        run: |
          BASE_VERSION=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)
          SHA_SHORT=$(git rev-parse --short HEAD)
          echo "version=${BASE_VERSION}-${SHA_SHORT}" >> "$GITHUB_OUTPUT"

      - name: Build JAR
        run: ./mvnw -B clean package -DskipTests

      - name: Authenticate to GCP via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          project_id: eventsphere-504909
          workload_identity_provider: projects/149096254626/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions-deployer@eventsphere-504909.iam.gserviceaccount.com

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Upload versioned JAR to GCS
        run: |
          JAR_FILE=$(find target -maxdepth 1 -name "*.jar" ! -name "*sources*" ! -name "*javadoc*")
          gcloud storage cp "$JAR_FILE" \
            "gs://eventsphere-504909-artifacts/user-service/${{ steps.version.outputs.version }}/user-service.jar"
